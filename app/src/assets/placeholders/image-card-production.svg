<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Image card Production placeholder">
  <title>Image card Production placeholder</title>
  <defs>
    <linearGradient id="icp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecebe6"/>
      <stop offset="1" stop-color="#dcd9d3"/>
    </linearGradient>
    <pattern id="icpp" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="1" fill="#6b6b6b" fill-opacity="0.14"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#icp)"/>
  <rect width="800" height="600" fill="url(#icpp)"/>
  <g transform="translate(400 300)" text-anchor="middle" font-family="'Poppins','Helvetica Neue',Arial,sans-serif">
    <text font-size="22" font-weight="500" letter-spacing="8" fill="#2b2b2b" fill-opacity="0.55">PRODUCTION</text>
    <line x1="-32" y1="22" x2="32" y2="22" stroke="#b8a069" stroke-width="1" stroke-opacity="0.6"/>
  </g>
</svg>