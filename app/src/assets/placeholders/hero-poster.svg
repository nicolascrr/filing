<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Fil'ing Broderies — hero video poster placeholder">
  <title>Fil'ing Broderies — hero video poster placeholder</title>
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="0.55" stop-color="#1f1f1f"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <pattern id="stitchDiag" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#b8a069" stroke-width="0.6" stroke-opacity="0.10"/>
    </pattern>
    <pattern id="dotGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.9" fill="#d4c4a0" fill-opacity="0.10"/>
    </pattern>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#heroGrad)"/>
  <rect width="1920" height="1080" fill="url(#stitchDiag)"/>
  <rect width="1920" height="1080" fill="url(#dotGrid)"/>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
  <g transform="translate(960 540)" text-anchor="middle" font-family="'Poppins','Helvetica Neue',Arial,sans-serif">
    <text y="-12" font-size="34" font-weight="500" letter-spacing="8" fill="#f8f6f3" fill-opacity="0.92">FIL'ING BRODERIES</text>
    <text y="34" font-size="13" font-weight="400" letter-spacing="6" fill="#b8a069" fill-opacity="0.85">BRODERIE DE LUXE</text>
    <line x1="-60" y1="58" x2="60" y2="58" stroke="#b8a069" stroke-width="1" stroke-opacity="0.6"/>
  </g>
</svg>