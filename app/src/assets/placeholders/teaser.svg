<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600" role="img" aria-label="Teaser placeholder">
  <title>Teaser placeholder</title>
  <defs>
    <linearGradient id="teaserGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="0.5" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#1f1f1f"/>
    </linearGradient>
    <pattern id="teaserStitch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#b8a069" stroke-width="0.5" stroke-opacity="0.12"/>
    </pattern>
    <radialGradient id="teaserVig" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="600" fill="url(#teaserGrad)"/>
  <rect width="1920" height="600" fill="url(#teaserStitch)"/>
  <rect width="1920" height="600" fill="url(#teaserVig)"/>
  <g transform="translate(960 300)" text-anchor="middle" font-family="'Poppins','Helvetica Neue',Arial,sans-serif">
    <text font-size="20" font-weight="500" letter-spacing="10" fill="#f8f6f3" fill-opacity="0.9">TEASER</text>
    <line x1="-36" y1="26" x2="36" y2="26" stroke="#b8a069" stroke-width="1" stroke-opacity="0.7"/>
  </g>
</svg>