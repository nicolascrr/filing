<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600" role="img" aria-label="Production — page hero placeholder">
  <title>Production — page hero placeholder</title>
  <defs>
    <linearGradient id="phpGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f6f3"/>
      <stop offset="0.55" stop-color="#ecebe6"/>
      <stop offset="1" stop-color="#dcd9d3"/>
    </linearGradient>
    <pattern id="phpDots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1" fill="#6b6b6b" fill-opacity="0.12"/>
    </pattern>
    <pattern id="phpHatch" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="22" y2="0" stroke="#b8a069" stroke-width="0.4" stroke-opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1920" height="600" fill="url(#phpGrad)"/>
  <rect width="1920" height="600" fill="url(#phpDots)"/>
  <rect width="1920" height="600" fill="url(#phpHatch)"/>
  <g transform="translate(960 300)" text-anchor="middle" font-family="'Poppins','Helvetica Neue',Arial,sans-serif">
    <text font-size="22" font-weight="500" letter-spacing="10" fill="#2b2b2b" fill-opacity="0.85">PRODUCTION</text>
    <line x1="-40" y1="28" x2="40" y2="28" stroke="#b8a069" stroke-width="1" stroke-opacity="0.7"/>
  </g>
</svg>